[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-column-profiler"
version = "1.0.0"
description = "Profile CSV columns for types, missing values, uniqueness, ranges, and frequent values."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jellywong343-sys" }]
dependencies = []
keywords = ["python","csv","data-profiling","data-quality","cli"]

[project.scripts]
csv-profile = "csv_column_profiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
